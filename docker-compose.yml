# Dev services for the DF Toolkit. Phase 0: database only.
# `docker compose up -d db` then run Alembic from backend/ (see backend/README.md).
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: df_toolkit
      POSTGRES_USER: df
      POSTGRES_PASSWORD: df
    ports:
      - "5432:5432"
    volumes:
      - df_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U df -d df_toolkit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  df_pgdata:
